name: Optimize cinematic video loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace eager video autoplay with viewport-aware loading
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('assets/js/main.js')
          text = path.read_text(encoding='utf-8')

          start = text.find('// Robust Multi-Trigger Autoplay Engine for all Video Elements')
          end_marker = '    initAllVideos();'
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Video autoplay block not found; refusing to modify the file.')
          end += len(end_marker)

          replacement = r'''// Performance-safe cinematic video engine: only load/play videos near the viewport.
    // Keeps the existing cinematic videos intact while preventing every video from
    // competing for bandwidth during the initial page load.
    function initAllVideos() {
      const allVideos = Array.from(document.querySelectorAll(
        ".hero-card-video, .skill-card-video, .section-full-bg-video"
      ));

      if (!allVideos.length) return;

      const prepareVideo = (video) => {
        if (video.dataset.klabsPrepared === "1") return;
        video.dataset.klabsPrepared = "1";
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("preload", "metadata");
      };

      const playVideo = (video) => {
        prepareVideo(video);
        const promise = video.play();
        if (promise && typeof promise.catch === "function") promise.catch(() => {});
      };

      const pauseVideo = (video) => {
        if (!video.paused) video.pause();
      };

      // Videos are activated shortly before they enter view, not all at once.
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const video = entry.target;
          if (entry.isIntersecting) {
            playVideo(video);
          } else {
            pauseVideo(video);
          }
        });
      }, { rootMargin: "300px 0px", threshold: 0.01 });

      allVideos.forEach((video) => {
        prepareVideo(video);
        observer.observe(video);
      });

      // The first viewport gets immediate playback without waking the entire page.
      requestAnimationFrame(() => {
        allVideos.forEach((video) => {
          const rect = video.getBoundingClientRect();
          if (rect.bottom > -300 && rect.top < window.innerHeight + 300) {
            playVideo(video);
          }
        });
      });

      // One interaction retry is enough for browsers with stricter autoplay policies.
      const unlockAutoplay = () => {
        allVideos.forEach((video) => {
          const rect = video.getBoundingClientRect();
          if (rect.bottom > 0 && rect.top < window.innerHeight) playVideo(video);
        });
        window.removeEventListener("scroll", unlockAutoplay);
        window.removeEventListener("touchstart", unlockAutoplay);
        window.removeEventListener("click", unlockAutoplay);
      };

      window.addEventListener("scroll", unlockAutoplay, { passive: true, once: true });
      window.addEventListener("touchstart", unlockAutoplay, { passive: true, once: true });
      window.addEventListener("click", unlockAutoplay, { passive: true, once: true });
    }

    initAllVideos();'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/main.js
          git diff --cached --quiet || git commit -m "Optimize cinematic video loading"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm -f .github/workflows/optimize-cinematic-video-loading.yml
          git commit -m "Remove one-time optimization workflow"
          git push
